<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Funcionários - Exercício 4</title>
</head>
<body>
  <h1>Relatórios com map, filter e reduce</h1>
  <p><a href="../index.html">&larr; Voltar ao menu</a></p>

  <h2>Formulário</h2>
  <form id="form-funcionario" onsubmit="return false;">
    <p>
      <label for="nome">Nome:</label>
      <input type="text" id="nome">
    </p>
    <p>
      <label for="idade">Idade:</label>
      <input type="number" id="idade" min="14">
    </p>
    <p>
      <label for="cargo">Cargo:</label>
      <input type="text" id="cargo">
    </p>
    <p>
      <label for="salario">Salário (R$):</label>
      <input type="number" id="salario" min="0" step="0.01">
    </p>
    <p>
      <button type="button" id="btn-salvar">Cadastrar</button>
      <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
    </p>
  </form>

  <h2>Funcionários cadastrados</h2>
  <table border="1" cellpadding="4">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Idade</th>
        <th>Cargo</th>
        <th>Salário</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="tabela-funcionarios"></tbody>
  </table>

  <h2>Relatórios</h2>
  <p>
    <button type="button" id="btn-salario-alto">Salário maior que R$ 5.000</button>
    <button type="button" id="btn-media-salarial">Média salarial</button>
    <button type="button" id="btn-cargos-unicos">Cargos únicos</button>
    <button type="button" id="btn-nomes-maiusculos">Nomes em maiúsculo</button>
  </p>
  <div id="relatorio"></div>

  <script src="funcionario.js"></script>
  <script src="script.js"></script>
</body>
</html>
